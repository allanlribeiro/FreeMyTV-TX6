name: Gerar APK TX6
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK com SDK preinstalado
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Validar APK compilado
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-TX6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK experimental para agente privado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeMyTV-TX6-test.apk
          sha256sum FreeMyTV-TX6-test.apk > FreeMyTV-TX6-test.apk.sha256
          # Recriar a release experimental evita conflito com assets antigos
          # que provocavam HTTP 404 ao tentar substituir arquivos.
          if gh release view tx6-test-latest >/dev/null 2>&1; then
            gh release delete tx6-test-latest --yes --cleanup-tag
          fi
          gh release create tx6-test-latest FreeMyTV-TX6-test.apk FreeMyTV-TX6-test.apk.sha256 \
            --title "TX6 - APK experimental" \
            --notes "APK de desenvolvimento para TX6. Teste separado da instalacao anterior." \
            --prerelease --target "$GITHUB_SHA"
