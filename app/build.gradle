plugins { id 'com.android.application' }
def tmdbKey = System.getenv('TMDB_API_KEY') ?: ''
def quotedTmdbKey = '"' + tmdbKey.replace('\\','\\\\').replace('"','\\"') + '"'
android { namespace 'org.freemytv.tx6test'; compileSdk 34
 defaultConfig { applicationId 'org.freemytv.tx6test'; minSdk 23; targetSdk 28; versionCode 1; versionName '0.4-tx6-test'; buildConfigField 'String', 'TMDB_API_KEY', quotedTmdbKey }
 buildFeatures { buildConfig true }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
